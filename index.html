<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>麻雀成績</title>
<meta name="theme-color" content="#E4E4DA">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="麻雀成績">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" href="favicon.png?v=2">
</head>
<body>
<style>
:root{
  --bg:#E4E4DA; --surface:#F5F4EE; --surface-2:#EBEAE1; --line:#C9CCC2; --line-soft:#DBDCD3;
  --ink:#1A2420; --ink-2:#4E5B55; --ink-3:#7C8781;
  --accent:#A93A2A; --accent-soft:#F0DDD8;
  --r1:#A07C0C; --r2:#7F8286; --r3:#A05A2C; --r4:#2E4A72; --r5:#7C7266; --r6:#5F6E76;
  --good:#3F7355; --bad:#9C3A2B;
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  --shadow:0 1px 2px rgba(26,36,32,.06),0 6px 20px rgba(26,36,32,.06);
  color-scheme: light;   /* 端末が夜モードでも暗くしない */
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;
  font-feature-settings:"palt" 1;}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);
  padding:0 0 96px;}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---- header ---- */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line-soft);}
/* 右端は表示中のページに重なるボタンが載るので、その分だけ空けておく */
.hd{display:flex;align-items:center;gap:10px;padding:12px 52px 12px 16px;min-height:56px}
/* 左右の余白を揃えて、見出しを画面の真ん中に置く */
.hd.center{padding-left:52px;justify-content:center}
.hd h1{font-family:var(--serif);font-size:18px;font-weight:600;margin:0;letter-spacing:.02em;
  flex:1;min-width:0;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .sub{font-size:11px;color:var(--ink-3);letter-spacing:.1em;margin:0}
.back{appearance:none;border:0;background:none;color:var(--ink-2);font-size:15px;
  padding:6px 4px 6px 0;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:2px}
.back:hover{color:var(--accent)}
/* 日付は見出しの見た目のまま、上に透明な日付入力を重ねてタップで選べるようにする */
.datepick{position:relative;display:inline-flex;align-items:center;gap:5px;margin-left:auto;
  font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.datepick .caret{font-size:11px;color:var(--ink-3);font-family:var(--sans)}
.datepick input{position:absolute;inset:-8px;width:auto;height:auto;opacity:0;
  border:0;padding:0;margin:0;background:none;cursor:pointer}
.datepick:focus-within{color:var(--accent)}
.datepick:focus-within .caret{color:var(--accent)}

/* ---- generic ---- */
main{padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.cards{display:contents}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;
  box-shadow:var(--shadow);overflow:hidden}
.card-p{padding:14px 16px}
.eyebrow{font-size:10.5px;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase;
  font-weight:600;margin:0 0 8px}
h2.sec{font-family:var(--serif);font-size:16px;font-weight:600;margin:0;letter-spacing:.03em}
.muted{color:var(--ink-3);font-size:13px}
.empty{text-align:center;padding:44px 20px;color:var(--ink-3);font-size:14px;line-height:1.9}

button{font-family:inherit}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:8px;padding:10px 16px;font-size:14.5px;font-weight:500;cursor:pointer;
  transition:.14s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.wide{width:100%}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:7px}
.btn.danger{color:var(--bad);border-color:transparent}
.btn:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}

input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;
  -webkit-appearance:none;appearance:none}
textarea{resize:vertical;line-height:1.5}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),
  linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

/* ---- tabs ---- */
.tabs{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--line-soft);
  background:var(--bg);position:sticky;top:56px;z-index:19}
.tab{appearance:none;border:0;background:none;color:var(--ink-3);font-size:14px;font-weight:500;
  padding:11px 12px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
  font-family:inherit}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

/* ---- list rows ---- */
.lrow{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;
  border-bottom:1px solid var(--line-soft);background:none;border-left:0;border-right:0;border-top:0;
  width:100%;text-align:left;font-family:inherit;font-size:15px;color:var(--ink)}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--surface-2)}
.lrow .grow{flex:1;min-width:0}
.chev{color:var(--ink-3);font-size:16px;flex-shrink:0}
/* 記録一覧の2行目：その日の各自のポイント（高い順） */
.sesscores{display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:4px;font-size:12px;line-height:1.5}
.ss{display:inline-flex;align-items:baseline;gap:4px;white-space:nowrap}
.ssname{color:var(--ink-2)}
.ss b{font-weight:600}

/* ---- stats ---- */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-soft)}
.stat{background:var(--surface);padding:12px 10px;text-align:center}
.stat .k{font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;margin-bottom:3px}
.stat .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .sub2{font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-top:2px}

.rk1{background:var(--r1)} .rk2{background:var(--r2)} .rk3{background:var(--r3)} .rk4{background:var(--r4)}
.pie{flex-shrink:0;display:block}
.pierow{display:flex;align-items:center;gap:18px;margin-top:12px}
.pielegend{flex:1;display:flex;flex-direction:column;gap:5px;font-size:12.5px;min-width:0}
.pli{display:flex;align-items:center;gap:6px}
.pli i{width:9px;height:9px;border-radius:2px;flex-shrink:0;display:block}
.pli b{margin-left:auto;font-size:13.5px;font-variant-numeric:tabular-nums}
.pli em{font-style:normal;color:var(--ink-3);font-size:11px;min-width:26px;text-align:right;
  font-variant-numeric:tabular-nums}
/* チップ・祝儀・ペナルティの入力行 */
.ppl{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.ppl:last-of-type{border-bottom:0}
.ppl-name{font-size:14px;font-weight:600;margin-bottom:6px}
.ppl-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld2{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--ink-3)}
.fld2 input{text-align:right;padding:8px 10px;font-variant-numeric:tabular-nums}
/* スマホの数字キーボードにマイナスキーがないので、符号はボタンで切り替える */
.signed{display:flex;gap:6px;align-items:stretch}
.signed input{flex:1;min-width:0}
.signbtn{flex:0 0 38px;border:1px solid var(--line);background:var(--surface);border-radius:8px;
  font-size:17px;font-weight:600;line-height:1;color:var(--ink-2);cursor:pointer;
  font-family:inherit;padding:0;transition:.12s}
.signbtn[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.signbtn:active{transform:scale(.94)}
input.neg{color:var(--bad);font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink-3);margin-top:8px}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:8px;height:8px;border-radius:2px;display:block}

.money{font-variant-numeric:tabular-nums;font-weight:600}
.plus{color:var(--good)} .minus{color:var(--bad)}

/* rank pill */
.rp{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
  border-radius:50%;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.rp1{background:var(--r1)} .rp2{background:var(--r2)} .rp3{background:var(--r3)} .rp4{background:var(--r4)}

/* game table */
.gtbl{width:100%;border-collapse:collapse;font-size:13.5px}
.gtbl th{font-size:10.5px;color:var(--ink-3);font-weight:600;letter-spacing:.06em;
  padding:8px 6px;text-align:right;border-bottom:1px solid var(--line-soft)}
.gtbl th:first-child{text-align:left}
.gtbl td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line-soft);
  font-variant-numeric:tabular-nums}
.gtbl td:first-child{text-align:left;color:var(--ink-2);font-size:12px;white-space:nowrap}
.gtbl tr:last-child td{border-bottom:0}
/* 半荘ごとの成績は4人ぶんの列が並ぶので、スマホの幅に収まるまで詰める */
.gtbl.games th,.gtbl.games td{padding:6px 3px}
/* 4人ぶんの列は中央ぞろえ。右端に寄って窮屈に見えるのを防ぐ */
.gtbl.games th:not(:first-child),.gtbl.games td:not(:first-child){text-align:center}
.gtbl.games th{font-size:10px;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gtbl.games td{font-size:12.5px}
.gtbl.games tr[data-toggle-game]{cursor:pointer}
.gtbl.games td:first-child,.gtbl.games th:first-child{width:1%;white-space:nowrap;
  padding-left:0;padding-right:6px;position:sticky;left:0;z-index:1;background:var(--surface)}
.gtbl.games tr.gopen td:first-child,.gtbl.games tr.ptrow td:first-child{background:var(--surface-2)}
.gtbl.games .rp{width:18px;height:18px;font-size:10.5px}
.gtbl.games .ptval{font-size:11px}
.gtbl.games .ptwind{margin-left:2px;font-size:9.5px}
.gtbl.games tr.ptrow td{white-space:nowrap}
/* 半荘の行をタップすると、終局時の点数がその下に開く */
.gtbl tr.gopen td{background:var(--surface-2);border-bottom:0}
.gtbl tr.ptrow td{background:var(--surface-2);padding-top:2px;padding-bottom:8px}
.gtbl tr.ptrow td:first-child{white-space:nowrap}
.ptval{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink-2)}
.ptval.minus{color:var(--bad);font-weight:600}
.ptwind{font-family:var(--serif);font-size:10.5px;color:var(--ink-3);margin-left:4px}
.gamecell{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn.editlink{padding:1px 5px;font-size:10px;line-height:1.5;
  color:var(--accent);border:1px solid var(--line);border-radius:5px}
.ptlabel{display:block;font-size:12.5px;color:var(--ink-2)}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* fab */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:30;
  width:min(488px,calc(100% - 32px));box-shadow:0 6px 24px rgba(0,0,0,.18)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,16,.5);z-index:40;
  animation:fade .18s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);
  border-radius:16px 16px 0 0;max-width:520px;margin:0 auto;max-height:92vh;overflow-y:auto;
  animation:up .24s cubic-bezier(.2,.8,.3,1);padding-bottom:env(safe-area-inset-bottom)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(20px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.scrim,.sheet{animation:none}}
.sheet-hd{position:sticky;top:0;background:var(--bg);padding:14px 16px 10px;
  border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px;z-index:2}
.sheet-hd h3{font-family:var(--serif);font-size:17px;margin:0;flex:1;font-weight:600}
.sheet-body{padding:16px}

/* seat input */
.seat{display:flex;align-items:center;gap:7px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.seat .wind{font-family:var(--serif);font-size:16px;width:18px;color:var(--ink-2);flex-shrink:0}
.seat select{flex:1;min-width:0;font-size:14px;padding:8px 10px}
.seat .signbtn{flex:0 0 34px;height:38px}
.seat input{width:100%;text-align:right;font-variant-numeric:tabular-nums;padding:8px 30px 8px 10px}
/* 100点単位で入れるので、末尾の「00」を欄の中に固定で見せる */
.ptfield{position:relative;flex:0 0 96px;display:block}
.ptsuffix{position:absolute;right:11px;top:50%;transform:translateY(-50%);pointer-events:none;
  font-size:16px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ptsuffix.neg{color:var(--bad);font-weight:600}
.resting{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:8px;
  padding:8px 12px;font-size:13px;color:var(--ink-2)}
.resting b{color:var(--ink);font-weight:600}
.tally{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;
  border-radius:8px;background:var(--surface-2);font-size:13px;margin-top:12px}
.tally.ok{background:color-mix(in srgb,var(--good) 12%,transparent);color:var(--good)}
.tally.ng{background:var(--accent-soft);color:var(--accent)}
/* チップと祝儀・ペナルティの検算を横に並べる */
.tallyrow{display:flex;gap:8px}
.tallyrow .tally{flex:1;min-width:0;flex-direction:column;align-items:flex-start;
  gap:1px;margin-top:0;padding:9px 11px}
.tallyrow .tally .k{font-size:10.5px;opacity:.85;letter-spacing:.04em}
.tallyrow .tally b{font-size:14px}
.tally b{font-variant-numeric:tabular-nums;font-size:15px}

.chip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:20px;
  padding:6px 13px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chiprow{display:flex;gap:7px;flex-wrap:wrap}
.sharebox{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:8px;
  padding:9px 11px;font-size:11px;word-break:break-all;line-height:1.5;color:var(--ink-2);
  font-family:ui-monospace,monospace}
.viewonly{margin:0;padding:8px 16px;background:var(--surface-2);border-bottom:1px solid var(--line-soft);
  font-size:11.5px;color:var(--ink-2);text-align:center}
.guesttag{font-size:9.5px;margin-left:5px;opacity:.75;border:1px solid currentColor;
  border-radius:3px;padding:0 3px;vertical-align:1px}
/* そのコミュニティで自分がどの立場か */
.roletag{font-family:var(--sans);font-size:10px;font-weight:600;margin-left:8px;
  border-radius:4px;padding:2px 6px;vertical-align:3px;white-space:nowrap}
.roletag.own {background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.roletag.edit{background:var(--accent-soft);color:var(--accent)}
.roletag.view{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line-soft)}

/* ===== ここから下は画面が広いときだけ効く。iPhoneの見た目は変わらない ===== */
@media (min-width:760px){
  /* 外側を少しだけ落として、アプリの列が1枚の紙として見えるようにする */
  body{background:#D9D9CE}
  #app{max-width:760px;border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft)}
  main{padding:20px 20px 24px}
  .tabs{padding:0 20px}
  .hd{padding-left:20px}

  /* カードを2列に並べる */
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}

  /* グラフは横幅いっぱいまで伸ばす（縦は比率どおり） */
  .scroller svg{width:100%;height:auto}

  /* 半荘の表は余裕をもたせる */
  .gtbl.games th,.gtbl.games td{padding:9px 7px}
  .gtbl.games th{font-size:11px}
  .gtbl.games td{font-size:13.5px}
  .gtbl.games .rp{width:21px;height:21px;font-size:12px}
  .gtbl.games .ptval{font-size:12.5px}
  .gtbl.games .ptwind{font-size:11px}

  /* 円グラフと内訳は横に伸ばさない（％が遠くに離れてしまうため） */
  .pierow{max-width:520px}

  /* 精算は「名前・チップ・祝儀ペナ」を横一列に */
  .ppl{display:grid;grid-template-columns:minmax(120px,200px) 1fr 1fr;gap:14px;align-items:end;padding:12px 0}
  .ppl-name{margin-bottom:0;align-self:center}
  .ppl-fields{display:contents}

  /* 入力用のシートは下から浮かせて、独立した箱に見せる */
  /* 広い画面では下に貼り付かず、画面の中央に浮かべる（transform は出現の動きに使うので使わない） */
  .sheet{top:0;bottom:0;height:fit-content;margin:auto;
    border-radius:16px;max-height:calc(100vh - 64px)}

  /* 設定は入力欄なので横に伸ばしすぎない */
  main.narrow{max-width:600px;margin-left:auto;margin-right:auto}
  .fab{width:min(420px,calc(100% - 40px))}
}
@media (min-width:1100px){
  #app{max-width:1000px}
  main{padding:24px 24px 28px}
  .tabs{padding:0 24px}
}

.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--ink);
  color:var(--bg);padding:9px 18px;border-radius:20px;font-size:13.5px;z-index:60;
  box-shadow:var(--shadow);animation:fade .2s;max-width:calc(100% - 32px)}
.toast.undo{display:flex;align-items:center;gap:14px;padding:8px 8px 8px 18px}
.toast.undo button{appearance:none;border:0;background:var(--bg);color:var(--ink);
  border-radius:14px;padding:5px 13px;font-size:13px;font-weight:600;cursor:pointer;
  font-family:inherit;white-space:nowrap}
</style>

<div id="app"></div>

<script>
"use strict";
const KEY = "mahjong-score-v1";
const WINDS = ["東","南","西","北"];

const UMA_PRESETS = {
  4: [
    {label:"ゴットー 5-10", uma:[10,5,-5,-10]},
    {label:"ワンツー 10-20", uma:[20,10,-10,-20]},
    {label:"ワンスリー 10-30", uma:[30,10,-10,-30]},
    {label:"ウマなし", uma:[0,0,0,0]}
  ],
  3: [
    {label:"5-10", uma:[10,0,-10]},
    {label:"10-20", uma:[20,0,-20]},
    {label:"ウマなし", uma:[0,0,0]}
  ]
};

/* iPhone の Safari は、しばらく開かないままだと保存を消してしまう。
   ホーム画面に追加したものはその対象外なので、追加を促す。 */
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = window.navigator.standalone === true ||
  (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);

/* ========== storage ========== */
function newDB(){ return {communities:[], sessions:[]}; }
let DB = newDB();

/* 保存は localStorage と sessionStorage の両方に書く。
   ブラウザによっては localStorage への書き込みが成功しても、タブを閉じると消される
   （iPhone Safari が別サイトの枠内で動くページに対してこの扱いをする）。
   その場合でも sessionStorage には残るので、消えたことを検知して警告できる。 */
function readStore(store){
  try { const raw = store.getItem(KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function writeStore(store, text){
  try { store.setItem(KEY, text); return true; } catch(e){ return false; }
}

let STORAGE_OK = true;    // そもそも書き込めるか
let STORAGE_LOST = false; // 書き込めたのに、次に開いたとき消えていたか
let SAVED_AT = null;

try {
  localStorage.setItem(KEY + "__probe", "1");
  localStorage.removeItem(KEY + "__probe");
} catch(e){ STORAGE_OK = false; }

{
  const local = readStore(localStorage);
  const session = readStore(sessionStorage);
  const pick = local || session;
  if (pick && Array.isArray(pick.communities)){
    DB = Object.assign(newDB(), pick);
    SAVED_AT = pick.savedAt || null;
  }
  // セッションには残っているのに localStorage から消えている＝保存が効いていない
  if (!local && session) STORAGE_LOST = true;
  try {
    if (localStorage.getItem(KEY + "__everSaved") && !local) STORAGE_LOST = true;
  } catch(e){}
}

// ルールの控えがない古い記録には、今のルールを焼き付けておく（以後ずれない）
{
  let changed = false;
  DB.sessions.forEach(s=>{
    const c = DB.communities.find(x=>x.id===s.communityId);
    if (c && !s.rules){ s.rules = JSON.parse(JSON.stringify(c.rules)); changed = true; }
  });
  if (changed) setTimeout(()=>save(), 0);
}

function save(){
  const text = JSON.stringify(Object.assign({}, DB, {savedAt: new Date().toISOString()}));
  SAVED_AT = new Date().toISOString();
  writeStore(sessionStorage, text);
  const ok = writeStore(localStorage, text);
  if (!ok && STORAGE_OK){ STORAGE_OK = false; toast("保存できませんでした。空き容量を確認してください"); }
  try { localStorage.setItem(KEY + "__everSaved", "1"); } catch(e){}
  if (typeof queueShare === "function") queueShare();
  if (typeof queueBackup === "function") queueBackup();
}
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);

/* ========== score calculation ========== */
/* 五捨六入。持ち点そのものを千点単位に丸めるのと同じ扱いにする。
   百の位が5以下なら切り捨て、6以上なら切り上げ。
   29,500点は29,000点扱い（素点−1）で、マイナス側も数直線どおりに下げる。 */
function round56(x){
  const f = x - Math.floor(x);
  return f >= 0.6 - 1e-9 ? Math.ceil(x) : Math.floor(x);
}

// points: 席順(起家から)の最終持ち点。並びが同じなら上家(起家に近い方)を上位とする。
function calcGame(points, rules){
  const n = points.length;
  const order = points.map((p,i)=>({p,i}))
                      .sort((a,b)=> b.p - a.p || a.i - b.i);
  const ranks = new Array(n);
  order.forEach((o,r)=>{ ranks[o.i] = r; });

  const oka = (rules.returnPoints - rules.startPoints) * n / 1000;
  const rankPt = new Array(n);   // 順位点（ウマ＋オカ）

  if (rules.tieBreak === "split"){
    // 同点の人たちは、その順位ぶんの順位点を足して山分けする
    let k = 0;
    while (k < n){
      let j = k;
      while (j+1 < n && order[j+1].p === order[k].p) j++;
      let total = 0;
      for (let r = k; r <= j; r++) total += (rules.uma[r] ?? 0) + (r === 0 ? oka : 0);
      const cnt = j - k + 1;
      const share = Math.round(total/cnt*10)/10;
      for (let r = k; r <= j; r++) rankPt[order[r].i] = share;
      // 割り切れないぶんは同点者のうち上家に寄せる（合計を保つため）
      rankPt[order[k].i] = Math.round((rankPt[order[k].i] + total - share*cnt)*10)/10;
      k = j + 1;
    }
  } else {
    for (let r = 0; r < n; r++) rankPt[order[r].i] = (rules.uma[r] ?? 0) + (r === 0 ? oka : 0);
  }

  const scores = new Array(n);
  let sum = 0;
  for (let i=0;i<n;i++){
    scores[i] = round56((points[i] - rules.returnPoints) / 1000) + rankPt[i];
    sum += scores[i];
  }
  // 素点の丸め誤差はトップが吸収して、合計を必ず 0 にする
  scores[order[0].i] = Math.round((scores[order[0].i] - sum)*10)/10;
  return {ranks, scores};
}

function defaultRules(playerCount){
  const n = playerCount || 4;
  return {
    playerCount:n,
    startPoints: n===3 ? 35000 : 25000,
    returnPoints: n===3 ? 40000 : 30000,
    uma: UMA_PRESETS[n][1].uma.slice(),
    rate: 100,
    chipPoints: 2,
    chipStart: 20,
    tieBreak: "seat"
  };
}

/* ========== 共有 ==========
   スプレッドシートを置き場所にして、コミュニティ単位でデータを預ける。
   入力する人の端末が本体で、預けるのはその写し。
   共有リンクを開いた人だけが読める（合言葉がリンクに入っている）。 */
const scriptUrl = id => `https://script.google.com/macros/s/${id}/exec`;

/* いつもの保管庫。リンクにIDを載せずに済ませるための既定値。
   別の保管庫を使っている場合だけ、リンクにIDを含める。 */
const DEFAULT_SCRIPT_ID =
  "AKfycbyx4wvBOwWha7YM2xLRwyCEILSU1Ktx9iGJH0OfEaD7oCFNClRh_9JPgWGL6AFJcnAp";

const shareScriptId = c => (c.share && c.share.id) || DB.syncId;

/* 保管庫の指定。長いURLを打たずに済むよう、合言葉ひとつでも通す。
   合言葉はソースを読めば分かるので、秘密ではなく「うっかり接続」よりの防止。 */
const VAULT_CODE = "品川神社";
/* 変換がうまくいかないときのために、読みでも通す */
const VAULT_ALIASES = [VAULT_CODE, "しながわじんじゃ", "シナガワジンジャ", "shinagawa"];
function resolveVault(input){
  const v = String(input || "").normalize("NFKC").replace(/\s/g, "");
  if (VAULT_ALIASES.some(a => a.toLowerCase() === v.toLowerCase())) return DEFAULT_SCRIPT_ID;
  const m = v.match(/\/macros\/s\/([\w-]+)\/exec/);
  return m ? m[1] : "";
}
const VAULT_ASK = "ウェブアプリのURL、または合言葉";
const VAULT_NG  = "URLか合言葉を入れてください";
const shareLink = (c, edit) => {
  const id = shareScriptId(c);
  const tail = (id === DEFAULT_SCRIPT_ID) ? c.share.key : id + "." + c.share.key;
  return location.origin + location.pathname + "?" + (edit ? "e" : "s") + "=" + tail;
};

let SHARE_STATE = "";          // 送信の状態を画面に出すため
const lastPushed = {};

// 送る中身。at は毎回変わるので、送る必要があるかの判定からは外す
function shareBody(c){
  return {
    name: c.name, rules: c.rules, carry: c.carry || {}, members: c.members,
    sessions: DB.sessions.filter(s=>s.communityId===c.id)
  };
}
function sharePayload(c){
  return Object.assign(shareBody(c), {at: new Date().toISOString()});
}

function pushShare(c, quiet){
  const id = shareScriptId(c);
  if (!id || !c.share || c.readOnly) return Promise.resolve();
  const body = JSON.stringify(shareBody(c));
  if (lastPushed[c.id] === body) return Promise.resolve();
  const payload = sharePayload(c);
  const text = body;
  if (!quiet){ SHARE_STATE = "送信中"; render(); }
  c.syncAt = payload.at;
  return fetch(scriptUrl(id), {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},   // 事前確認を挟ませない
    body: JSON.stringify({k: c.share.key, data: payload})
  }).then(r=>{
    // 書き込みが通っても、返ってくるのが JSON とは限らない（転送先のページが返る）。
    // 通信が成立していれば送れたものとして扱う。
    if (!r.ok) throw new Error("http " + r.status);
    lastPushed[c.id] = text; SHARE_STATE = "";
    if (!quiet) render();
  }).catch(()=>{
    // 返事を読めない環境でも、書き込み自体は通ることがあるので投げ直す
    return fetch(scriptUrl(id), {
      method: "POST", mode: "no-cors",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify({k: c.share.key, data: payload})
    }).then(()=>{ lastPushed[c.id] = text; SHARE_STATE = ""; if (!quiet) render(); })
      .catch(()=>{ SHARE_STATE = "送信できませんでした"; if (!quiet) render(); });
  });
}

// 記録が変わったら、共有中のコミュニティにまとめて送る
let pushTimer = null;
function queueShare(){
  if (!DB.syncId) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(()=>{
    DB.communities.filter(c=>c.share && !c.readOnly).forEach(c=>pushShare(c, true));
  }, 1200);
}

/* 自動バックアップ。共有と同じ保管庫に、記録まるごとの控えを置く。
   共有していないコミュニティも含めて預ける。合言葉は端末の中だけに持つ。 */
let BACKUP_STATE = "";
let lastBackup = null, backupTimer = null;

function backupBody(){
  return {communities: DB.communities, sessions: DB.sessions, syncId: DB.syncId};
}
function pushBackup(quiet){
  if (!DB.syncId || !DB.backupKey) return Promise.resolve();
  const body = JSON.stringify(backupBody());
  if (lastBackup === body) return Promise.resolve();
  const at = new Date().toISOString();
  if (!quiet){ BACKUP_STATE = "保存中"; render(); }
  return fetch(scriptUrl(DB.syncId), {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify({k: "bk_" + DB.backupKey, data: Object.assign(backupBody(), {at})})
  }).then(r=>{
    if (!r.ok) throw new Error("http " + r.status);
    lastBackup = body; DB.backupAt = at; BACKUP_STATE = "";
    try { localStorage.setItem(KEY, JSON.stringify(Object.assign({}, DB, {savedAt:at}))); } catch(e){}
    if (!quiet) render();
  }).catch(()=>{ BACKUP_STATE = "保存できませんでした"; if (!quiet) render(); });
}
function queueBackup(){
  if (!DB.syncId || !DB.backupKey) return;
  clearTimeout(backupTimer);
  backupTimer = setTimeout(()=>pushBackup(true), 3000);
}
function pullBackup(){
  if (!DB.syncId || !DB.backupKey) return Promise.resolve(null);
  return fetch(scriptUrl(DB.syncId) + "?k=" + encodeURIComponent("bk_" + DB.backupKey))
    .then(r=>r.json()).then(d=>(d && !d.error && d.communities) ? d : null).catch(()=>null);
}

/* 預けてある写しを読み直す。相手が更新していれば手元も追いつく。 */
function pullShare(c){
  const id = shareScriptId(c);
  if (!id || !c.share) return Promise.resolve(false);
  return fetch(scriptUrl(id) + "?k=" + encodeURIComponent(c.share.key))
    .then(r=>r.json())
    .then(d=>{
      if (!d || d.error || !d.name) return false;
      if (c.syncAt && d.at && d.at <= c.syncAt) return false;   // 変わっていない
      c.name = d.name; c.members = d.members; c.rules = d.rules;
      c.carry = d.carry || {}; c.syncAt = d.at;
      const tag = "shared_" + c.share.key + "_";
      DB.sessions = DB.sessions.filter(s=>s.communityId!==c.id)
        .concat((d.sessions||[]).map(s=>Object.assign({}, s, {communityId:c.id,
          id: c.sharedFrom
            ? (s.id.startsWith(tag) ? s.id : tag + s.id)   // 受け取り側は印を付ける
            : s.id.replace(tag, "")})));                    // 送り主側は印を外して元に戻す
      lastPushed[c.id] = JSON.stringify(shareBody(c));   // 読んだ直後に送り返さない
      save();
      return true;
    }).catch(()=>false);
}
function refreshShared(all){
  const list = DB.communities.filter(c=>c.share && (all || c.readOnly));
  if (!list.length) return;
  Promise.all(list.map(pullShare)).then(r=>{ if (r.some(Boolean)) render(); });
}
document.addEventListener("visibilitychange", ()=>{
  if (!document.hidden) refreshShared(true);          // 戻ってきたら読み直す
});
setInterval(()=>{ if (!document.hidden) refreshShared(false); }, 60000);  // 閲覧中は1分おき

/* 共有リンクで開かれたときは、預けてある写しを読んで並べる */
let SHARED_LOADING = false, SHARED_ERROR = "";
function applyShared(id, key, d, canEdit){
  const cid = "shared_" + key;
  const c = {id:cid, name:d.name, members:d.members, rules:d.rules,
             carry:d.carry || {}, share:{key, id}, sharedFrom:true,
             readOnly:!canEdit, sharedAt:d.at, syncAt:d.at};
  DB.communities = DB.communities.filter(x=>x.id!==cid).concat([c]);
  const tag = cid + "_";
  DB.sessions = DB.sessions.filter(s=>s.communityId!==cid).concat(
    (d.sessions||[]).map(s=>Object.assign({}, s,
      {communityId:cid, id: s.id.startsWith(tag) ? s.id : tag + s.id})));
  lastPushed[cid] = JSON.stringify(shareBody(c));
  save();
  return cid;
}
/* ?setup=保管庫ID を開くと、その端末を保管庫につなぐ。
   URLを手で貼らずに済ませるための一度きりの入口。 */
function loadSetup(){
  const raw = new URLSearchParams(location.search).get("setup");
  if (!raw) return false;
  const id = resolveVault(raw) || (/^[\w-]{20,}$/.test(raw) ? raw : "");
  if (!id) return false;
  DB.syncId = id;
  save();
  history.replaceState(null, "", location.pathname);
  render();
  toast("保管庫につながりました");
  return true;
}

function loadShared(){
  const q = new URLSearchParams(location.search);
  const p = q.get("s") || q.get("e");
  if (!p) return;
  const bits = p.split(".");
  // 「合言葉だけ」「ID.合言葉」「ID.合言葉.e」のどれでも読めるようにする
  const id  = bits.length === 1 ? DEFAULT_SCRIPT_ID : bits[0];
  const key = bits.length === 1 ? bits[0] : bits[1];
  const canEdit = q.has("e") || bits[2] === "e";
  if (!id || !key) return;
  SHARED_LOADING = true; SHARED_ERROR = ""; render();
  fetch(scriptUrl(id) + "?k=" + encodeURIComponent(key))
    .then(r=>r.json())
    .then(d=>{
      if (!d || d.error || !d.name) throw new Error(d && d.error || "empty");
      const cid = applyShared(id, key, d, canEdit);
      SHARED_LOADING = false;
      go({name:"community", id:cid, tab:"stats"});
    })
    .catch(()=>{
      SHARED_LOADING = false;
      SHARED_ERROR = "共有された記録を読み込めませんでした";
      render();
    });
}

/* ========== derived data ========== */
const community = id => DB.communities.find(c=>c.id===id);

/* その日のルール。卓を始めた時点のルールを控えてあるので、
   あとで設定を変えても過去の記録は変わらない。
   控えのない古い記録は、コミュニティの今のルールで読む。 */
const rulesOf = s => s.rules || community(s.communityId).rules;
const chipStart  = r => r.chipStart ?? 20;   // 1人が最初に持つチップ枚数
const chipPoints = r => r.chipPoints ?? 2;   // チップ1枚が何ポイントか

/* チップは終了時の枚数で入力する。持ち枚数（既定20枚）との差が増減になる。
   s.chips に増減が直接入っている古い記録もそのまま読めるようにしてある。 */
function chipDelta(s, mid){
  const v = (s.chipCounts||{})[mid];
  if (v !== undefined && v !== null && v !== "") return v - chipStart(rulesOf(s));
  return (s.chips||{})[mid] || 0;
}

/* 祝儀は現物を動かさず記録だけ残すので、枚数ではなくポイントで直接持つ。
   1件＝「受け取る人・払う人・1人あたりのポイント」。
   ツモは払う人が3人、ロンは1人。それだけの違いなので入力欄は分けない。 */
/* 符号は数字を打つ前に＋/−を選べるよう、値とは別に覚えておく。 */
const penSign = {}, carrySign = {};
function penSignOf(s, mid){
  const k = s.id + ":" + mid;
  if (penSign[k] !== undefined) return penSign[k];
  return ((s.penalties||{})[mid] || 0) < 0 ? -1 : 1;
}

/* 引き継ぎ：このアプリを使う前の成績。通算のポイントと収支にだけ効く。 */
const carryOf = (c, mid) => (c.carry||{})[mid] || 0;
function carrySignOf(c, mid){
  const k = c.id + ":" + mid;
  if (carrySign[k] !== undefined) return carrySign[k];
  return carryOf(c, mid) < 0 ? -1 : 1;
}

function tipDelta(s, mid){
  return (s.tips||[]).reduce((a,t)=>{
    if (t.toId === mid) return a + t.per * t.fromIds.length;
    if (t.fromIds.includes(mid)) return a - t.per;
    return a;
  }, 0);
}
const sessionsOf = cid => DB.sessions.filter(s=>s.communityId===cid)
  .sort((a,b)=> a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
const memberName = (c,id) => (c.members.find(m=>m.id===id)||{name:"(削除済)"}).name;
/* ゲストはその日だけの参加者。コミュニティの通算には入れない。 */
const isGuest = (c,id) => !!((c.members.find(m=>m.id===id)||{}).guestOf);
const regulars = c => c.members.filter(m=>!m.guestOf);

// コミュニティ全体の成績。返り値: memberId -> stats
function statsOf(cid){
  const c = community(cid);
  const out = {};
  // 初期値は必ずここだけで作る（項目を足したときの入れ忘れを防ぐため）
  const blank = (id, name) => ({id, name, games:0, ranks:[0,0,0,0], scoreSum:0,
                 chips:0, tips:0, penalty:0, extraPoints:0, money:0});
  regulars(c).forEach(m=>{ out[m.id] = blank(m.id, m.name); });   // ゲストは通算に入れない
  const ensure = id => out[id] || (out[id] = blank(id, memberName(c,id)));

  // 日ごとにその日のルールで円に直してから足す（レートが途中で変わっても壊れない）
  sessionsOf(cid).forEach(s=>{
    const R = rulesOf(s);
    s.games.forEach(g=>{
      const {ranks, scores} = calcGame(g.points, R);
      g.seats.forEach((mid,i)=>{
        if (isGuest(c, mid)) return;
        const st = ensure(mid);
        st.games++;
        st.ranks[ranks[i]]++;
        st.scoreSum += scores[i];
        st.money += scores[i] * R.rate;
      });
    });
    s.participantIds.forEach(mid=>{
      if (isGuest(c, mid)) return;
      const st = ensure(mid);
      const d = chipDelta(s, mid), tp = tipDelta(s, mid);
      const pt = d*chipPoints(R) + tp;
      st.chips += d; st.tips += tp;
      st.extraPoints += pt;
      st.money += pt * R.rate;
    });
    Object.entries(s.penalties||{}).forEach(([mid,v])=>{
      if (!v || isGuest(c, mid)) return;
      const st = ensure(mid);
      st.penalty += v; st.extraPoints += v; st.money += v * R.rate;
    });
  });

  Object.values(out).forEach(st=>{
    // 引き継ぎは成績には混ぜず、収支だけに効かせる（今のレートで換算）
    st.carry = carryOf(c, st.id);
    st.carryMoney = st.carry * c.rules.rate;
    st.money = Math.round(st.money + st.carryMoney);
    const g = st.games;
    st.avgRank = g ? st.ranks.reduce((a,n,i)=>a+n*(i+1),0)/g : 0;
    st.rate = st.ranks.map(n=> g ? n/g : 0);
    st.rentai = g ? (st.ranks[0]+st.ranks[1])/g : 0;
    st.avgScore = g ? st.scoreSum/g : 0;
    st.avgMoney = g ? st.money/g : 0;
  });
  return out;
}

/* 1人ぶんの通算成績。席順別・飛び率・同卓相手別まで出す。
   席は seats の並び（0=起家）なので、そこから東南西北がそのまま取れる。 */
function memberStats(cid, mid, sid){
  const c = community(cid);
  const n = c.rules.playerCount;
  const out = {
    games:0, ranks:new Array(n).fill(0), score:0, tobi:0, pointsSum:0,
    best:null, worst:null, bestPt:0, worstPt:0, streakTop:0, streakLast:0,
    bySeat: Array.from({length:n}, ()=>({games:0, ranks:new Array(n).fill(0), score:0})),
    vs: {}
  };
  let runTop = 0, runLast = 0;

  // sid を渡すとその日だけ、渡さなければコミュニティの通算
  const target = sid ? sessionsOf(cid).filter(s=>s.id===sid) : sessionsOf(cid);
  target.forEach(s=>{
    const R = rulesOf(s);
    s.games.forEach(g=>{
      const i = g.seats.indexOf(mid);
      if (i < 0) return;
      const {ranks, scores} = calcGame(g.points, R);
      const r = ranks[i];

      out.games++; out.ranks[r]++; out.score += scores[i];
      out.pointsSum += g.points[i];
      if (g.points[i] < 0) out.tobi++;
      // 最高・最低は、そのときの終局時の持ち点も一緒に覚えておく
      if (out.best  === null || scores[i] > out.best) { out.best  = scores[i]; out.bestPt  = g.points[i]; }
      if (out.worst === null || scores[i] < out.worst){ out.worst = scores[i]; out.worstPt = g.points[i]; }

      const bs = out.bySeat[i];
      bs.games++; bs.ranks[r]++; bs.score += scores[i];

      g.seats.forEach((other,j)=>{
        if (j === i) return;
        const v = out.vs[other] || (out.vs[other] = {games:0, rankSum:0, score:0});
        v.games++; v.rankSum += r + 1; v.score += scores[i];
      });

      if (r === 0)   { runTop++;  out.streakTop  = Math.max(out.streakTop,  runTop);  } else runTop = 0;
      if (r === n-1) { runLast++; out.streakLast = Math.max(out.streakLast, runLast); } else runLast = 0;
    });
  });
  return out;
}
const avgRankOf = (ranks, games) => games ? ranks.reduce((a,v,i)=>a+v*(i+1),0)/games : 0;

// 1セッション内の成績
function sessionTotals(s){
  const c = community(s.communityId);
  const R = rulesOf(s);
  const t = {};
  const ensure = id => t[id] ||
    (t[id] = {score:0, games:0, ranks:[0,0,0,0], best:null, worst:null});
  s.games.forEach(g=>{
    const {ranks, scores} = calcGame(g.points, R);
    g.seats.forEach((mid,i)=>{
      const e = ensure(mid);
      e.score += scores[i]; e.games++; e.ranks[ranks[i]]++;
      e.best  = e.best  === null ? scores[i] : Math.max(e.best,  scores[i]);
      e.worst = e.worst === null ? scores[i] : Math.min(e.worst, scores[i]);
    });
  });
  s.participantIds.forEach(ensure);
  Object.entries(t).forEach(([mid,e])=>{
    e.chips = chipDelta(s, mid);
    e.tips = tipDelta(s, mid);
    e.penalty = (s.penalties||{})[mid] || 0;
    e.extraPoints = e.chips*chipPoints(R) + e.tips + e.penalty;  // チップ＋祝儀＋ペナルティ
    e.money = Math.round((e.score + e.extraPoints) * R.rate);
  });
  return t;
}

/* ========== helpers ========== */
const esc = s => String(s).replace(/[&<>"']/g, m =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const yen = n => (n<0?"−":"") + "¥" + Math.abs(Math.round(n)).toLocaleString("ja-JP");
// 山分けで小数が出ることがあるので、小数第1位まで見せる
const signed = n => {
  const r = Math.round(n*10)/10;
  return (r>0?"+":r<0?"−":"") + Math.abs(r);
};
const pct = n => Math.round(n*100) + "%";
const cls = n => n>0 ? "plus" : n<0 ? "minus" : "";
const today = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};
const fmtDate = iso => {
  const [y,m,d] = iso.split("-");

  return `${Number(m)}月${Number(d)}日(${w})`;

function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());

}

let undoData = null;
function deleteWithUndo(msg, view, fn){
  const before = JSON.stringify(DB), beforeView = JSON.parse(JSON.stringify(V));
  fn();
  save();
  undoData = {db:before, view:beforeView};

// 着順の割合を円グラフにする。12時から時計回りに1着→4着の順。
function pieSvg(rates, size){
  const r = size/2 - 0.5, cx = size/2, cy = size/2;
  const open = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"
    class="pie" role="img" aria-label="着順の割合">`;
  const parts = rates.map((v,i)=>({v,i})).filter(o=>o.v>0);
  if (!parts.length)
    return `${open}<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--surface-2)"/></svg>`;
  if (parts.length === 1)
    return `${open}<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--r${parts[0].i+1})"/></svg>`;
  let a = -Math.PI/2;
  const slices = parts.map(o=>{
    const a1 = a + o.v*Math.PI*2;
    const x0 = (cx + r*Math.cos(a)).toFixed(2),  y0 = (cy + r*Math.sin(a)).toFixed(2);
    const x1 = (cx + r*Math.cos(a1)).toFixed(2), y1 = (cy + r*Math.sin(a1)).toFixed(2);
    const big = o.v > 0.5 ? 1 : 0;
    a = a1;
    return `<path d="M${cx},${cy} L${x0},${y0} A${r},${r} 0 ${big} 1 ${x1},${y1} Z"
      fill="var(--r${o.i+1})" stroke="var(--surface)" stroke-width="1.5"/>`;
  }).join("");
  return `${open}${slices}</svg>`;
}

// 目盛りに使うキリのいい間隔を選ぶ
function niceStep(range, target){
  const raw = Math.max(range,1) / target;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
}
// 年をまたいだときだけ「2027/」を付ける

};

/* 折れ線グラフの共通部分。series は順位の高い順に並べて渡す。
   線の色は1位から 金・銀・銅・紺 の順。 */
function lineChart(series, minPad, left, mid, right, wide){
  const len = Math.max(...series.map(s=>s.pts.length));
  const all = series.flatMap(s=>s.pts);
  const lo = Math.min(...all, 0), hi = Math.max(...all, 0);
  const pad = Math.max(minPad, (hi-lo)*0.12);
  const y0 = lo-pad, y1 = hi+pad;
  /* 広い画面で全幅に置くグラフだけ横長にする。
     入る枠より viewBox が小さいと軸の文字まで拡大され、大きいと潰れて読めなくなるため、
     置かれる場所の広さに合わせて呼び出し側が指定する。 */
  const W = wide ? 760 : 360, H = wide ? 210 : 150;
  const L=46, R=6, T=10, B=10;
  const px = i => L + (len<=1 ? 0 : i/(len-1))*(W-L-R);
  const py = v => T + (1-(v-y0)/(y1-y0))*(H-T-B);

  const step = niceStep(y1-y0, 4);
  const ticks = [];
  for (let v = Math.ceil(y0/step)*step; v <= y1; v += step) ticks.push(Math.round(v));
  const axis = ticks.map(v=>{
    const y = py(v).toFixed(1), isZero = v === 0;
    return `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"
        stroke="var(--line${isZero?"":"-soft"})" stroke-width="1"
        ${isZero ? 'stroke-dasharray="3 3"' : ""}/>
      <text x="${L-6}" y="${y}" text-anchor="end" dominant-baseline="middle"
        font-size="10" fill="var(--ink-3)">${v.toLocaleString("ja-JP")}</text>`;
  }).join("");

  const colorOf = k => `var(--r${Math.min(k+1, 6)})`;
  const lines = series.map((s,k)=>{
    const col = colorOf(k);
    const d = s.pts.map((v,i)=>`${i?"L":"M"}${px(i).toFixed(1)},${py(v).toFixed(1)}`).join("");
    const dots = s.pts.map((v,i)=>
      `<circle cx="${px(i).toFixed(1)}" cy="${py(v).toFixed(1)}"
        r="${i===s.pts.length-1?2.8:1.8}" fill="${col}"/>`).join("");
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="1.8"
       stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join("");

  return {
    colorOf,
    html: `<div class="scroller"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}"
        role="img" aria-label="累積の推移">${axis}${lines}</svg></div>
      <div class="between muted" style="font-size:10.5px;margin-top:2px;padding-left:44px">
        <span>${left}</span><span>${mid}</span><span>${right}</span>
      </div>`
  };
}

/* その日の成績（ポイント）を半荘ごとに足し上げた折れ線。
   序盤は良かったのに終盤で崩れた、といった流れが読める。 */
function dayChart(s, c){
  if (!s.games.length) return "";
  const t = sessionTotals(s);
  const ids = s.participantIds.filter(id => t[id] && t[id].games > 0);
  if (!ids.length) return "";

  const run = {};
  const series = ids.map(id=>{ run[id] = 0; return {id, name:memberName(c,id), pts:[]}; });
  s.games.forEach(g=>{
    const {scores} = calcGame(g.points, rulesOf(s));
    series.forEach(se=>{
      const i = g.seats.indexOf(se.id);
      if (i >= 0) run[se.id] += scores[i];
      se.pts.push(run[se.id]);
    });
  });
  series.sort((a,b)=> b.pts[b.pts.length-1] - a.pts[a.pts.length-1]);

  const g = lineChart(series, 5, "半荘1", `全${s.games.length}半荘`, `半荘${s.games.length}`, false);
  const legend = series.map((se,k)=>{
    const v = se.pts[se.pts.length-1];
    return `<span><i style="background:${g.colorOf(k)}"></i>${esc(se.name)}
      <b class="num ${cls(v)}" style="font-weight:600">${signed(v)}</b></span>`;
  }).join("");

  return `<div class="card"><div class="card-p" style="padding-bottom:10px">
      <p class="eyebrow">今日の成績（半荘ごとの累積）</p>
      ${g.html}<div class="legend">${legend}</div>
    </div></div>`;
}

/* 日ごとの収支を足し上げた累積の折れ線（円）。
   その日打っていない人の線は横ばいになる。 */
function chart(c, st){
  const sessions = sessionsOf(c.id);
  const members = Object.values(st).filter(s=>s.games>0);
  if (!members.length || !sessions.length)
    return `<p class="muted" style="margin:0">記録がたまるとグラフが出ます</p>`;

  // 引き継ぎがある人は、そのぶんを起点にする
  const run = {};
  const series = members.map(m=>{
    run[m.id] = carryOf(c, m.id) * c.rules.rate;   // 引き継ぎは1日目の値に含める
    return {id:m.id, name:m.name, pts:[]};
  });
  sessions.forEach(s=>{
    const t = sessionTotals(s);
    series.forEach(se=>{
      run[se.id] += t[se.id] ? t[se.id].money : 0;
      se.pts.push(run[se.id]);
    });
  });

  // 今の順位が高い順に並べ、1位から 金・銀・銅・紺 の順で色を振る
  series.sort((a,b)=> b.pts[b.pts.length-1] - a.pts[a.pts.length-1]);

  const first = sessions[0], lastS = sessions[sessions.length-1];
  const crossYear = first.date.slice(0,4) !== lastS.date.slice(0,4);
  // 成績タブのグラフは横いっぱいに置くので、広い画面では横長に描く
  const g = lineChart(series, 100,
    fmtAxisDate(first.date, false), `${sessions.length}日`, fmtAxisDate(lastS.date, crossYear), WIDE);

  // 凡例には最新（今の累計）を円で添える
  const legend = series.map((s,k)=>{
    const v = s.pts[s.pts.length-1];
    return `<span><i style="background:${g.colorOf(k)}"></i>${esc(s.name)}
      <b class="num ${cls(v)}" style="font-weight:600">${yen(v)}</b></span>`;
  }).join("");

  return g.html + `<div class="legend">${legend}</div>`;
}

function tabLog(c){
  const ss = sessionsOf(c.id).slice().reverse();
  const rows = ss.map(s=>{
    const t = sessionTotals(s);
    const list = Object.entries(t).filter(([,e])=>e.games)
      .sort((a,b)=> b[1].score - a[1].score);   // ポイントの高い順に左から
    return `<button class="lrow" data-go-session="${s.id}">
      <div class="grow">
        <div class="row" style="gap:8px">
          <span style="font-weight:600">${fmtDate(s.date)}</span>

        ${list.length ? `<div class="sesscores">${list.map(([mid,e])=>
          `<span class="ss"><span class="ssname">${esc(memberName(c,mid))}</span

}

/* ---- 個人の詳細（通算） ---- */
function viewMember(){
  const c = community(V.cid);
  if (!c) { V = {name:"home"}; return viewHome(); }
  const mid = V.mid;
  const sess = V.sid ? DB.sessions.find(x=>x.id===V.sid) : null;   // その日だけか、通算か
  const m = memberStats(V.cid, mid, V.sid);
  const n = c.rules.playerCount;
  const st = (sess ? sessionTotals(sess)[mid] : statsOf(V.cid)[mid]) || {money:0, extraPoints:0};
  const scopeLabel = sess ? fmtDate(sess.date) : "通算";
  const totalScore = sess ? (st.score || 0) : (st.scoreSum || 0);  // 通算には引き継ぎが入る
  const rate = m.games ? m.ranks.map(r=>r/m.games) : new Array(n).fill(0);
  const avg = avgRankOf(m.ranks, m.games);

  const back = `<button class="back" data-go-back>‹ 戻る</button>`;
  if (!m.games) return `<header><div class="hd">${back}
      <span class="datepick" style="pointer-events:none">${esc(memberName(c,mid))}</span></div></header>
    <main class="stack"><div class="empty">${sess ? "この日は打っていません。" : "まだ半荘の記録がありません。"}</div>
      ${sess ? `<button class="btn wide" data-go-member-total="${c.id}:${mid}">
        通算成績</button>` : ""}</main>`;

  // 席順別
  const seatRows = m.bySeat.map((b,i)=>`<tr>
    <td><span style="font-family:var(--serif);font-size:15px">${WINDS[i]}</span></td>
    <td class="num">${b.games}</td>
    <td class="num">${b.games ? avgRankOf(b.ranks,b.games).toFixed(2) : "—"}</td>
    <td class="num">${b.games ? pct(b.ranks[0]/b.games) : "—"}</td>
    <td class="num">${b.games ? pct(b.ranks[n-1]/b.games) : "—"}</td>
    <td class="num">${b.games ? pct((b.ranks[0]+b.ranks[1])/b.games) : "—"}</td>
    <td class="num ${cls(b.score)}">${b.games ? signed(Math.round(b.score/b.games*10)/10) : "—"}</td>
  </tr>`).join("");

  // 同卓相手別（自分の平均着順が良い順）
  const vs = Object.entries(m.vs).map(([id,v])=>({id, ...v}))
    .filter(v=>v.games>0)
    .sort((a,b)=> a.rankSum/a.games - b.rankSum/b.games);
  const vsRows = vs.map(v=>`<tr>
    <td>${esc(memberName(c,v.id))}</td>
    <td class="num">${v.games}</td>
    <td class="num">${(v.rankSum/v.games).toFixed(2)}</td>
    <td class="num ${cls(v.score)}">${signed(Math.round(v.score/v.games*10)/10)}</td>
  </tr>`).join("");

  return `<header><div class="hd">${back}
      <span class="datepick" style="pointer-events:none">${esc(memberName(c,mid))}</span>
    </div></header>
    <main class="stack">
      <div class="card">
        <div class="card-p" style="padding-bottom:8px">
          <p class="eyebrow" style="margin:0">${scopeLabel} ${m.games}半荘</p></div>
        <div class="statgrid">
          <div class="stat"><div class="k">成績</div>
            <div class="v ${cls(totalScore)}">${signed(totalScore)}</div></div>
          <div class="stat"><div class="k">チップ</div>
            <div class="v ${cls(st.extraPoints||0)}">${signed(st.extraPoints||0)}</div></div>
          <div class="stat"><div class="k">収支</div>
            <div class="v ${cls(st.money)}" style="font-size:16px">${yen(st.money)}</div>
            ${!sess && st.carryMoney ? `<div class="sub2">うち引き継ぎ ${yen(st.carryMoney)}</div>` : ""}</div>
        </div>
        <div class="statgrid" style="border-top:1px solid var(--line-soft)">
          <div class="stat"><div class="k">平均着順</div><div class="v">${avg.toFixed(2)}</div></div>
          <div class="stat"><div class="k">連対率</div>
            <div class="v">${pct((m.ranks[0]+m.ranks[1])/m.games)}</div></div>
          <div class="stat"><div class="k">平均持ち点</div>
            <div class="v" style="font-size:16px">${Math.round(m.pointsSum/m.games).toLocaleString("ja-JP")}</div></div>
        </div>
        <div class="statgrid" style="border-top:1px solid var(--line-soft)">
          <div class="stat"><div class="k">トップ率</div>
            <div class="v" style="color:var(--r1)">${pct(rate[0])}</div></div>
          <div class="stat"><div class="k">ラス回避率</div>
            <div class="v">${pct(1 - rate[n-1])}</div></div>
          <div class="stat"><div class="k">飛び率</div>
            <div class="v">${pct(m.tobi/m.games)}</div></div>
        </div>
        <div class="card-p">
          <div class="pierow" style="margin-top:0">
            ${pieSvg(rate, 92)}
            <div class="pielegend">
              ${rate.map((r,i)=>`<div class="pli">
                <i class="rk${i+1}"></i><span>${i+1}着</span>
                <b style="color:var(--r${i+1})">${pct(r)}</b><em>${m.ranks[i]}回</em></div>`).join("")}
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-p" style="padding-bottom:4px"><p class="eyebrow">席順別の成績</p></div>
        <div class="scroller" style="padding:0 16px 14px"><table class="gtbl">
          <thead><tr><th>席</th><th>半荘</th><th>平均着順</th><th>トップ</th><th>ラス</th><th>連対</th><th>平均</th></tr></thead>
          <tbody>${seatRows}</tbody></table></div>
      </div>

      <div class="${vs.length ? "cards" : ""}">
      <div class="card">
        <div class="card-p" style="padding-bottom:8px"><p class="eyebrow">自己ベスト</p></div>
        <div class="statgrid" style="grid-template-columns:repeat(4,1fr)">
          <div class="stat"><div class="k">最高スコア</div>
            <div class="v plus" style="font-size:17px">${signed(m.best)}</div>
            <div class="sub2">${m.bestPt.toLocaleString("ja-JP")}点</div></div>
          <div class="stat"><div class="k">最低スコア</div>
            <div class="v minus" style="font-size:17px">${signed(m.worst)}</div>
            <div class="sub2">${m.worstPt.toLocaleString("ja-JP")}点</div></div>
          <div class="stat"><div class="k">連続トップ</div>
            <div class="v" style="font-size:17px">${m.streakTop}</div></div>
          <div class="stat"><div class="k">連続ラス</div>
            <div class="v" style="font-size:17px">${m.streakLast}</div></div>
        </div>
      </div>

      ${vs.length ? `<div class="card">
        <div class="card-p" style="padding-bottom:4px"><p class="eyebrow">対戦相手別の成績</p></div>
        <div class="scroller" style="padding:0 16px 14px"><table class="gtbl">
          <thead><tr><th>相手</th><th>同卓</th><th>平均着順</th><th>平均</th></tr></thead>
          <tbody>${vsRows}</tbody></table></div>
      </div>` : ""}
      </div>

      ${sess && !isGuest(c, mid) ? `<button class="btn wide" data-go-member-total="${c.id}:${mid}">
          通算成績</button>`
        : sess ? `<p class="muted" style="text-align:center;font-size:11.5px">
          この日だけのゲストなので、通算には入りません。</p>` : ""}
    </main>`;
}

/* ---- session ---- */
function viewSession(){
  const s = DB.sessions.find(x=>x.id===V.id);
  if (!s) { V={name:"home"}; return viewHome(); }
  const c = community(s.communityId);
  const t = sessionTotals(s);
  const parts = s.participantIds;
  const R = rulesOf(s);
  const n = R.playerCount;

  const totalsRows = parts.map(mid=>{
    const e = t[mid] || {score:0,games:0,money:0,chips:0,penalty:0,extraPoints:0};
    return `<tr><td>${esc(memberName(c,mid))}</td>
      <td class="num">${e.games}</td>
      <td class="num ${cls(e.score)}">${signed(e.score)}</td>
      <td class="num ${cls(e.extraPoints)}">${signed(e.extraPoints)}</td>
      <td class="money ${cls(e.money)}">${yen(e.money)}</td></tr>`;
  }).join("");

  const gamesTbl = s.games.length ? `
    <div class="card"><div class="scroller" style="padding:0 10px"><table class="gtbl games">
      <thead><tr><th></th>${parts.map(mid=>
        `<th>${esc(memberName(c,mid))}</th>`).join("")}</tr></thead>
      <tbody>${s.games.map((g,gi)=>{
        const {ranks,scores} = calcGame(g.points, R);
        const by = {};
        g.seats.forEach((mid,i)=>{ by[mid] = {r:ranks[i]+1, s:scores[i], p:g.points[i], w:WINDS[i]}; });
        const open = (V.openGames || []).includes(gi);
        return `<tr class="${open?"gopen":""}" data-toggle-game="${gi}">
          <td><span class="gamecell">
            <button class="btn ghost sm" data-toggle-game="${gi}"
              style="padding:2px 4px;font-size:11px">半荘${gi+1} ${open?"▾":"›"}</button>
            ${open && !c.readOnly ? `<button class="btn editlink" data-edit-game="${gi}">修正</button>` : ""}
          </span></td>
          ${parts.map(mid=> by[mid]
            ? `<td><span class="row" style="justify-content:center;gap:4px">
                 <span class="rp rp${by[mid].r}">${by[mid].r}</span>
                 <span class="${cls(by[mid].s)}" style="min-width:26px;text-align:right">${signed(by[mid].s)}</span></span></td>`
            : `<td class="muted">—</td>`).join("")}</tr>
        ${open ? `<tr class="ptrow">
          <td><span class="ptlabel">持ち点</span></td>
          ${parts.map(mid=> by[mid]
            ? `<td><span class="ptval ${by[mid].p<0?"minus":""}">${by[mid].p.toLocaleString("ja-JP")}</span>
                 <span class="ptwind">${by[mid].w}</span></td>`
            : `<td></td>`).join("")}</tr>` : ""}`;
      }).join("")}</tbody>
    </table></div></div>` : `<div class="empty">半荘を追加してください。</div>`;

  const tab = V.stab || "score";

  const scoreTab = `<main class="stack">
      ${c.readOnly ? `<div style="text-align:center;margin-bottom:-2px">
        <button class="btn sm" data-refresh-share style="padding:7px 22px">
          ${SHARE_STATE || "今すぐ読み込む"}</button>
        <div class="muted" style="font-size:11px;margin-top:5px">${c.syncAt
          ? new Date(c.syncAt).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}) + "時点"
          : "共有中"}</div>
      </div>` : ""}
      <div class="${s.games.length ? "cards" : ""}">
        <div class="card"><div class="card-p" style="padding-bottom:6px"><p class="eyebrow">今日の収支</p></div>
          <div class="scroller" style="padding:0 16px 14px"><table class="gtbl">
            <thead><tr><th>名前</th><th>半荘数</th><th>成績</th><th>チップ</th><th>収支</th></tr></thead>
            <tbody>${totalsRows}</tbody></table></div></div>
        ${dayChart(s, c)}
      </div>

      <div><p class="eyebrow" style="padding:0 2px">半荘ごとの成績</p>${gamesTbl}</div>
    </main>
    ${c.readOnly ? "" : `<button class="btn primary fab" data-add-game
      ${parts.length < n ? "disabled style='opacity:.5'" : ""}>＋ 半荘を追加</button>`}`;

  const setupTab = `<main class="stack">
      <div class="card card-p">
        <h2 class="sec">チップ・祝儀・ペナルティ</h2>
        ${parts.map(mid=>{
          const cnt = (s.chipCounts||{})[mid];
          const d = chipDelta(s, mid);
          return `<div class="ppl">
          <div class="ppl-name">${esc(memberName(c,mid))}</div>
          <div class="ppl-fields">
            <label class="fld2">チップ（終了時の枚数）
              <span class="row" style="gap:6px">
                <input inputmode="numeric" value="${cnt ?? ""}"
                  placeholder="${chipStart(R)}" data-chip="${mid}">

                  aria-pressed="${penSignOf(s,mid) < 0}"
                  aria-label="${esc(memberName(c,mid))}の祝儀・ペナルティの符号を切り替える"
                  >${penSignOf(s,mid) < 0 ? "−" : "＋"}</button>
                <input inputmode="numeric" placeholder="0" data-penalty="${mid}"

                  value="${(s.penalties||{})[mid] ? Math.abs(s.penalties[mid]) : ""}">
              </span></div>
          </div>
        </div>`;}).join("")}
        ${(()=>{
          const total = parts.reduce((a,mid)=>{
            const v = (s.chipCounts||{})[mid];
            return a + (v == null || v === "" ? chipStart(R) : v);
          }, 0);
          const want = chipStart(R) * parts.length;
          const chipOk = total === want;
          const penSum = parts.reduce((a,mid)=> a + ((s.penalties||{})[mid] || 0), 0);
          const penOk = penSum === 0;
          return `<div class="stack" style="gap:8px;margin-top:12px">
            <div class="tallyrow">
              <div class="tally ${chipOk?"ok":"ng"}">
                <span class="k">チップ合計</span>
                <b class="num">${chipOk ? `${want}枚 ✓` : `${total>want?"+":""}${total-want}枚 ずれ`}</b></div>
              <div class="tally ${penOk?"ok":"ng"}">
                <span class="k">祝儀・ペナルティ合計</span>
                <b class="num">${penOk ? "±0 ✓" : `${signed(penSum)} ずれ`}</b></div>
            </div>
          </div>`;
        })()}
      </div>

      <div class="card card-p stack">
        <h2 class="sec">参加メンバー</h2>
        <div class="chiprow">${c.members
          .filter(m=>!m.guestOf || m.guestOf === s.id)
          .map(m=>`<button class="chip" aria-pressed="${parts.includes(m.id)}"
            data-toggle-part="${m.id}">${esc(m.name)}${
            m.guestOf ? '<span class="guesttag">ゲスト</span>' : ""}</button>`).join("")}</div>
        <button class="btn sm" data-add-guest>＋ ゲストを追加</button>
      </div>

      <div class="card card-p">
        <button class="btn danger wide" data-del-session
          style="border:1px solid var(--line)">この日の記録を削除</button>
      </div>
    </main>`;

  return `<header><div class="hd">
      <button class="back" data-go-community="${c.id}">‹ ${esc(c.name)}</button>
      <span class="datepick">${fmtDate(s.date)}<span class="caret">▾</span>
        <input type="date" value="${s.date}" data-session-date aria-label="日付を選ぶ"></span>
    </div></header>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="${tab==="score"}" data-stab="score">成績</button>
      ${c.readOnly ? "" :
        `<button class="tab" role="tab" aria-selected="${tab==="setup"}" data-stab="setup">精算</button>`}
      <button class="tab" role="tab" aria-selected="${tab==="data"}" data-stab="data">データ</button>
    </div>
    ${tab==="score" ? scoreTab : (tab==="setup" && !c.readOnly) ? setupTab : dataTab()}`;

  /* ---- データタブ：その日ぶんだけを詳しく見る ---- */
  function dataTab(){
    if (!s.games.length) return `<main><div class="empty">
      半荘を記録すると、この日の内訳が出ます。</div></main>`;

    const rows = parts.map(mid=>({mid, e:t[mid]}))
      .filter(o=>o.e)
      .sort((a,b)=> b.e.money - a.e.money);

    const cards = rows.map(({mid,e})=>{
      const rate = e.games ? e.ranks.map(r=>r/e.games) : [0,0,0,0];
      const avg  = e.games ? e.ranks.reduce((a,r,i)=>a+r*(i+1),0)/e.games : 0;
      const rentai = e.games ? (e.ranks[0]+e.ranks[1])/e.games : 0;
      return `<button class="card" style="display:block;width:100%;text-align:left;
          font-family:inherit;color:inherit;cursor:pointer;padding:0"
          data-go-member="${c.id}:${mid}">
        <div class="card-p" style="padding-bottom:12px">
          <div class="between">
            <div style="font-family:var(--serif);font-size:16px;font-weight:600">${esc(memberName(c,mid))}
              <span class="chev" style="font-size:14px">›</span></div>
            <div class="money ${cls(e.money)}" style="font-size:17px">${yen(e.money)}</div>
          </div>
          <div class="muted num">${e.games}半荘${e.games ?
            ` · 平均着順 ${avg.toFixed(2)} · 連対率 ${pct(rentai)}` : ""}</div>
          ${e.games ? `<div class="pierow">
            ${pieSvg(rate.slice(0,n), 84)}
            <div class="pielegend">
              ${rate.slice(0,n).map((r,i)=>`<div class="pli">
                <i class="rk${i+1}"></i><span>${i+1}着</span>
                <b style="color:var(--r${i+1})">${pct(r)}</b><em>${e.ranks[i]}回</em></div>`).join("")}
            </div></div>` : ""}
        </div>
        <div class="statgrid" style="grid-template-columns:repeat(${e.penalty?3:2},1fr)">
          <div class="stat"><div class="k">成績</div>
            <div class="v ${cls(e.score)}">${signed(e.score)}</div></div>
          <div class="stat"><div class="k">チップ</div>
            <div class="v ${cls(e.chips)}">${signed(e.chips)}枚</div></div>
          ${e.penalty ? `<div class="stat"><div class="k">祝儀・ペナルティ</div>
            <div class="v ${cls(e.penalty)}">${signed(e.penalty)}</div></div>` : ""}
        </div>
        ${e.games ? `<div class="card-p" style="padding-top:10px">
          <div class="muted num" style="font-size:11.5px">
            最高 ${signed(e.best)} · 最低 ${signed(e.worst)} · 平均 ${(e.score/e.games).toFixed(1)}</div>
        </div>` : ""}
      </button>`;
    }).join("");

    const umaTxt = R.uma.map(u=>signed(u)).join(" / ");
    return `<main class="stack"><div class="cards">${cards}</div>
      <div class="card card-p">
        <p class="eyebrow" style="margin:0 0 6px">この日のルール</p>
        <div class="muted num" style="font-size:11.5px;line-height:1.8">
          ${R.playerCount}人打ち・配給原点 ${R.startPoints.toLocaleString("ja-JP")}・返し点 ${R.returnPoints.toLocaleString("ja-JP")}<br>
          ウマ ${umaTxt}・${R.tieBreak==="split"?"同点は山分け":"同点は上家優先"}<br>
          レート ${R.rate}円・チップ1枚 ${chipPoints(R)}ポイント・持ち枚数 ${chipStart(R)}枚
        </div>
      </div>
    </main>`;
  }
}

/* ========== sheets ==========
   公開ページはサンドボックス内で動くため prompt / confirm が使えない。
   入力・確認はすべてこのシートで行う。 */
function renderSheet(){
  document.querySelectorAll(".scrim,.sheet").forEach(e=>e.remove());
  const scrim = document.createElement("div");
  scrim.className = "scrim"; scrim.dataset.closeSheet = "1";
  const el = document.createElement("div");
  el.className = "sheet";
  el.innerHTML =
    sheet.kind === "text"    ? sheetText()    :
    sheet.kind === "confirm" ? sheetConfirm() :
    sheet.kind === "choice"  ? sheetChoice()  :
    sheet.kind === "data"    ? sheetData()    : sheetGame();
  document.body.append(scrim, el);
  fitSheetAboveKeyboard();
  if (sheet.kind === "game" || !sheet.kind){
    updateTally();
    // 開いた直後だけ先頭に合わせる。符号ボタンで作り直したときに飛ばないように
    if (sheet.focusFirst){
      const first = el.querySelector("input[data-pt]");
      if (first) first.focus();
      sheet.focusFirst = false;
    }
  } else {
    const f = el.querySelector("input[data-ask],textarea[data-ask]");
    if (f){ f.focus(); if (f.value) f.select(); }
  }
}

/* スマホでキーボードが出ると、画面下に固定したシートがその裏に隠れて
   決定ボタンを押せなくなる。キーボードの高さぶん持ち上げて必ず届くようにする。 */
function fitSheetAboveKeyboard(){
  const el = document.querySelector(".sheet");
  const vv = window.visualViewport;
  if (!el || !vv) return;
  const hidden = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
  const wide = window.matchMedia("(min-width:760px)").matches;
  // 広い画面でキーボードが出ていないときは、CSS側の位置（画面中央）に任せる
  if (!hidden && wide){
    el.style.bottom = ""; el.style.maxHeight = ""; el.style.top = ""; el.style.margin = "";
    return;
  }
  // iPadでキーボードが出たときは、中央寄せをやめて鍵盤の上に置き直す
  if (wide){ el.style.top = "auto"; el.style.margin = "0 auto"; }
  el.style.bottom = hidden + "px";
  el.style.maxHeight = Math.round(vv.height * 0.94) + "px";
}
if (window.visualViewport){
  window.visualViewport.addEventListener("resize", fitSheetAboveKeyboard);
  window.visualViewport.addEventListener("scroll", fitSheetAboveKeyboard);
}
document.addEventListener("focusin", e=>{
  if (e.target.matches("input,textarea,select")) setTimeout(fitSheetAboveKeyboard, 120);
});

function sheetGame(){

          </span>
        </div>`).join("")}
