<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 撮影用：iPhone の Hiragino の代わりに Noto CJK を使う（apt install fonts-noto-cjk） -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <alias binding="same"><family>Hiragino Sans</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>Noto Sans JP</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>Hiragino Mincho ProN</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
  <alias binding="same"><family>Noto Serif JP</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
  <alias binding="same"><family>Hiragino Kaku Gothic ProN</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
</fontconfig>
