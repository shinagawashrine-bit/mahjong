function readDraft(){
  const el = document.querySelector(".sheet");
  if (!el || !sheet || sheet.kind !== "game") return;
  el.querySelectorAll("[data-seat]").forEach(sel=>{
    sheet.draft.seats[+sel.dataset.seat] = sel.value;
  });
  el.querySelectorAll("[data-pt]").forEach(inp=>{
    const i = +inp.dataset.pt;
    const v = inp.value.trim();
    if (v === ""){ sheet.draft.points[i] = null; return; }
    const num = Number(v);
    if (isNaN(num)){ sheet.draft.points[i] = null; return; }
    // 「-12」と直接打たれたら、符号ボタンの側もそれに合わせる
    if (v.startsWith("-") || num < 0) sheet.draft.signs[i] = -1;
    // 入力は100点単位。327 → 32,700
    sheet.draft.points[i] = Math.abs(Math.round(num)) * 100 * sheet.draft.signs[i];
  });
}

function updateTally(){
  const el = document.querySelector(".sheet");
  if (!el || !sheet || sheet.kind !== "game") return;
  const s = DB.sessions.find(x=>x.id===V.id);
  const c = community(s.communityId);
  const R = rulesOf(s);
  const n = R.playerCount;
  const target = R.startPoints * n;
  const pts = sheet.draft.points;
  const filled = pts.filter(p=>p!==null && !isNaN(p));
  const sum = filled.reduce((a,b)=>a+b,0);
  const t = document.getElementById("tally");
  const prev = document.getElementById("preview");
  const dupes = new Set(sheet.draft.seats).size !== n;

  if (dupes){
    t.className = "tally ng";
    t.innerHTML = `<span>同じ人が2席に入っています</span>`;
    prev.innerHTML = ""; return;
  }
  if (filled.length < n){
    const rest = target - sum;
    t.className = "tally";
    // あと1人なら残りは確定するので、ボタンで入れられるようにする
    t.innerHTML = filled.length === n-1
      ? `<span>残り <b class="num">${rest.toLocaleString("ja-JP")}</b></span>
         <button class="btn sm" data-fill-rest style="padding:4px 12px">残りを入れる</button>`
      : `<span>残り ${n-filled.length}人分</span>
         <b class="num">${rest.toLocaleString("ja-JP")}</b>`;
    prev.innerHTML = ""; return;
  }
  if (sum !== target){
    t.className = "tally ng";
    t.innerHTML = `<span>合計が ${target.toLocaleString("ja-JP")} になりません</span>
      <b class="num">${(sum-target>0?"+":"")}${(sum-target).toLocaleString("ja-JP")}</b>`;
    prev.innerHTML = ""; return;
  }
  t.className = "tally ok";
  t.innerHTML = `<span>合計 ${target.toLocaleString("ja-JP")} ✓</span>`;

  const {ranks, scores} = calcGame(pts, R);
  prev.innerHTML = `<p class="eyebrow" style="margin-top:6px">この半荘の結果</p>
    <table class="gtbl"><tbody>${sheet.draft.seats.map((mid,i)=>`
      <tr><td><span class="row"><span class="rp rp${ranks[i]+1}">${ranks[i]+1}</span>
        <span style="color:var(--ink)">${esc(memberName(c,mid))}</span></span></td>
        <td class="num muted">${pts[i].toLocaleString("ja-JP")}</td>
        <td class="num ${cls(scores[i])}" style="font-weight:600">${signed(scores[i])}</td></tr>`).join("")}
    </tbody></table>`;
}

function openGameSheet(index){
  const s = DB.sessions.find(x=>x.id===V.id);
  const n = rulesOf(s).playerCount;
  let draft;
  if (index == null){
    // 直前の半荘の席をずらして初期値にする（抜け番のローテーションに合わせやすくする）
    const last = s.games[s.games.length-1];
    let seats;
    if (last && s.participantIds.length > n){
      const order = s.participantIds;
      const start = (order.indexOf(last.seats[0]) + 1) % order.length;
      seats = Array.from({length:n}, (_,i)=> order[(start+i)%order.length]);
    } else {
      seats = s.participantIds.slice(0,n);
    }
    draft = {seats, points:Array(n).fill(null), signs:Array(n).fill(1)};
  } else {
    const g = s.games[index];
    draft = {seats:g.seats.slice(), points:g.points.slice(),
             signs:g.points.map(p=> p < 0 ? -1 : 1)};
  }
  sheet = {kind:"game", index, draft, focusFirst:true};
  render();
}

/* 控えから元に戻す。合言葉が無い端末（機種変えなど）では合言葉を聞いてから読みにいく。 */
/* 控えから元に戻す。合言葉が無い端末（機種変えなど）では合言葉を聞いてから読みにいく。
   fresh=true は今その場で合言葉を入れた場合。見つからなければ間違いなので消す。 */
function doRestoreBackup(fresh){
  if (!DB.backupKey){
    const askKey = ()=> askText("自動で復元",
      "前の端末に出ていた合言葉", "", "読み込む", k=>{
        k = k.trim();
        if (!k){ toast("合言葉を入れてください"); return false; }
        DB.backupKey = k; save();
        doRestoreBackup(true);
      });
    if (DB.syncId) return askKey();
    return askText("自動で復元", VAULT_ASK, "", "つなぐ", v=>{
      const id = resolveVault(v);
      if (!id){ toast(VAULT_NG); return false; }
      DB.syncId = id; save();
      askKey();
    });
  }
  BACKUP_STATE = "読み込み中"; render();
  return pullBackup().then(d2=>{
    BACKUP_STATE = "";
    if (!d2){
      if (fresh){ delete DB.backupKey; save(); }
      render();
      return toast("控えが見つかりませんでした");
    }
    render();
    const n = d2.communities.length, days = (d2.sessions||[]).length;
    return askConfirm("控えから元に戻す",
      `${d2.at ? new Date(d2.at).toLocaleString("ja-JP") + "時点の" : ""}コミュニティ${n}件・${days}日分に置き換えます。`,
      "元に戻す", ()=>{
        const keep = DB.backupKey;
        DB = Object.assign(newDB(), {communities:d2.communities, sessions:d2.sessions,
                                     syncId:d2.syncId, backupKey:keep, backupAt:d2.at});
        lastBackup = JSON.stringify(backupBody());
        save(); go({name:"home"});
        toast("控えから元に戻しました");
      });
  });
}

/* ========== events ========== */
document.addEventListener("click", e=>{
  const t = e.target.closest("button,[data-close-sheet],[data-toggle-game]");
  if (!t) return;
  const d = t.dataset;

  if (d.goHome !== undefined) return go({name:"home"});
  if (d.goCommunity) return go({name:"community", id:d.goCommunity, tab:"stats"});
  if (d.goSession) return go({name:"session", id:d.goSession});
  if (d.tab) { V.tab = d.tab; return render(); }
  if (d.stab) { V.stab = d.stab; return render(); }

  if (d.choice !== undefined){
    const ch = sheet && sheet.choices && sheet.choices[+d.choice];
    if (!ch) return;
    sheet = null;
    return ch.run();
  }

  if (d.rotateSeats !== undefined){
    readDraft();
    const s = DB.sessions.find(x=>x.id===V.id);
    const order = s.participantIds, n = rulesOf(s).playerCount;
    const start = (order.indexOf(sheet.draft.seats[0]) + 1) % order.length;
    sheet.draft.seats = Array.from({length:n}, (_,i)=> order[(start+i)%order.length]);
    return renderSheet();
  }

  if (d.startBackup !== undefined){
    if (DB.backupKey){
      BACKUP_STATE = "保存中"; render();
      return pushBackup().then(()=>{
        BACKUP_STATE = ""; render();
        toast("控えを保存しました");
      });
    }
    const begin = ()=>{
      const rnd = () => Math.random().toString(36).slice(2);
      DB.backupKey = (rnd()+rnd()).slice(0,12);
      save(); render();
      pushBackup().then(()=>{ if (!BACKUP_STATE) toast("バックアップを始めました"); });
    };
    if (DB.syncId) return begin();
    return askText("自動バックアップ", VAULT_ASK, "", "つなぐ", v=>{
      const id = resolveVault(v);
      if (!id){ toast(VAULT_NG); return false; }
      DB.syncId = id; save();
      begin();
    });
  }
  if (d.restoreBackup !== undefined) return doRestoreBackup();

  if (d.startShare !== undefined){
    const c = community(V.id);
    const begin = ()=>{
      // 合言葉は10文字。リンクを短く保ちつつ、当てずっぽうでは届かない長さ
      const rnd = () => Math.random().toString(36).slice(2);
      c.share = {key: (rnd()+rnd()).slice(0,10), id: DB.syncId};
      save(); render();
      pushShare(c);
    };
    if (DB.syncId) return begin();
    return askText("共有をはじめる", VAULT_ASK, "", "つなぐ", v=>{
      const id = resolveVault(v);
      if (!id){ toast(VAULT_NG); return false; }
      DB.syncId = id; save();
      begin();
    });
  }
  if (d.refreshShare !== undefined){
    const c = V.name === "session"
      ? community((DB.sessions.find(x=>x.id===V.id)||{}).communityId)
      : community(V.id);
    if (!c) return;
    SHARE_STATE = "読み込み中"; render();
    return pullShare(c).then(ch=>{ SHARE_STATE = ""; render(); toast(ch ? "最新にしました" : "変わりありません"); });
  }
  if (d.copyShare !== undefined){
    const c = community(V.id);
    const text = shareLink(c, d.copyShare === "edit");
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(text).then(()=>toast("コピーしました"),
        ()=>toast("長押しで選択してコピーしてください"));
    else toast("長押しで選択してコピーしてください");
    return;
  }
  if (d.pushShare !== undefined){
    const c = community(V.id);
    lastPushed[c.id] = null;
    pushShare(c).then(()=>{ if (!SHARE_STATE) toast("最新の状態を送りました"); });
    return;
  }
  if (d.stopShare !== undefined){
    const c = community(V.id);
    return askConfirm("共有をやめる",
      "リンクを開いても見られなくなります。手元の記録は消えません。", "やめる", ()=>{
        delete c.share; delete lastPushed[c.id];
        save(); go({name:"community", id:c.id, tab:"settings"});
        toast("共有をやめました");
      });
  }

  if (d.applyRulesToPast !== undefined){
    const c = community(V.id);
    const list = DB.sessions.filter(s=>s.communityId===c.id);
    return askConfirm("過去の記録にも適用",
      `${list.length}日ぶんの記録を、今のルールで計算し直します。`, "適用する", ()=>{
        list.forEach(s=>{ s.rules = JSON.parse(JSON.stringify(c.rules)); });
        save(); go({name:"community", id:c.id, tab:"settings"});
        toast("過去の記録にも適用しました");
      });
  }

  if (d.undo !== undefined){
    if (!undoData) return;
    DB = JSON.parse(undoData.db);
    const back = undoData.view;
    undoData = null; save();
    document.querySelectorAll(".toast").forEach(t=>t.remove());
    go(back);
    return toast("元に戻しました");
  }

  if (d.goMember){
    const [cid, mid] = d.goMember.split(":");
    // その日の画面から開いたときはその日だけ、成績タブから開いたときは通算
    const sid = V.name === "session" ? V.id : null;
    return go({name:"member", cid, mid, sid, back:V});
  }
  if (d.goMemberTotal){
    const [cid, mid] = d.goMemberTotal.split(":");
    return go({name:"member", cid, mid, sid:null, back:V});
  }
  if (d.goBack !== undefined) return go(V.back || {name:"home"});

  if (d.addGuest !== undefined){
    const s = DB.sessions.find(x=>x.id===V.id);
    const c = community(s.communityId);
    return askText("ゲストを追加", "名前", "", "追加", name=>{
      if (!name.trim()){ toast("名前を入れてください"); return false; }
      // guestOf を持つ人はこの日だけの参加者。通算には出てこない
      const m = {id:uid(), name:name.trim(), isMe:false, guestOf:s.id};
      c.members.push(m);
      s.participantIds.push(m.id);
      save();
    });
  }

  if (d.newCommunity !== undefined){
    return askText("コミュニティを作る", "名前（例: 大学の面子、金曜フリー）", "", "作る", name=>{
      if (!name.trim()){ toast("名前を入れてください"); return false; }
      const c = {id:uid(), name:name.trim(), members:[], rules:defaultRules(4)};
      DB.communities.push(c); save();
      go({name:"community", id:c.id, tab:"settings"});
      toast("次にメンバーを登録してください");
    });
  }

  if (d.addMember !== undefined){
    const c = community(V.id);
    return askText("メンバーを追加", "名前", "", "追加", name=>{
      if (!name.trim()){ toast("名前を入れてください"); return false; }
      c.members.push({id:uid(), name:name.trim(), isMe:false});
      save();
    });
  }
  if (d.setMe){
    const c = community(V.id);
    const cur = c.members.find(m=>m.id===d.setMe);
    const on = !cur.isMe;
    c.members.forEach(m=>{ m.isMe = false; });
    cur.isMe = on;
    save(); return render();
  }
  if (d.delMember){
    const c = community(V.id);
    const id = d.delMember;
    // 「その日の参加者に入っている」だけでは記録とみなさない。
    // 実際に打ったか、チップ・祝儀・ペナルティに値が入っている人だけを守る
    const used = DB.sessions.some(s=> s.communityId===c.id && (
      s.games.some(g=>g.seats.includes(id)) ||
      (s.chipCounts||{})[id] != null ||
      ((s.penalties||{})[id] || 0) !== 0 ||
      (s.tips||[]).some(t=>t.toId===id || t.fromIds.includes(id))));
    if (used) return toast("記録に使われているので削除できません");
    c.members = c.members.filter(m=>m.id!==id);
    if (c.carry) delete c.carry[id];
    DB.sessions.forEach(x=>{ if (x.communityId===c.id)
      x.participantIds = x.participantIds.filter(p=>p!==id); });
    save(); return render();
  }
  if (d.umaPreset){
    const c = community(V.id);
    c.rules.uma = UMA_PRESETS[c.rules.playerCount][+d.umaPreset].uma.slice();
    save(); return render();
  }
  if (d.delCommunity !== undefined){
    const c = community(V.id);
    return askConfirm("コミュニティを削除", `「${c.name}」と、その記録をすべて削除します。`,
      "削除する", ()=>{
        deleteWithUndo(`「${c.name}」を削除しました`, {name:"home"}, ()=>{
          DB.sessions = DB.sessions.filter(s=>s.communityId!==c.id);
          DB.communities = DB.communities.filter(x=>x.id!==c.id);
        });
      });
  }

  if (d.newSession !== undefined){
    const c = community(V.id);
    if (regulars(c).length < c.rules.playerCount)
      return toast(`先に設定タブでメンバーを${c.rules.playerCount}人以上登録してください`);
    const start = ()=>{
      // 卓を始めた時点のルールを控える。あとで設定を変えてもこの日の記録は変わらない
      const s = {id:uid(), communityId:c.id, date:today(),
        rules: JSON.parse(JSON.stringify(c.rules)),
        participantIds:regulars(c).map(m=>m.id), games:[], chips:{}, penalties:{}};
      DB.sessions.push(s); save();
      go({name:"session", id:s.id});
    };
    // 同じ日の記録が既にあるなら、続けるか別の卓かを聞く
    const same = DB.sessions.filter(x=>x.communityId===c.id && x.date===today());
    if (!same.length) return start();
    const last = same[same.length-1];
    return askChoice("今日の記録があります",
      `${fmtDate(last.date)}に${last.games.length}半荘の記録があります。`, [
        {label:"今日の卓を続ける", primary:true, run:()=>go({name:"session", id:last.id})},
        {label:"別の卓として始める", run:start}
      ]);
  }
  if (d.togglePart){
    const s = DB.sessions.find(x=>x.id===V.id);
    if (s.participantIds.includes(d.togglePart)){
      if (s.games.some(g=>g.seats.includes(d.togglePart)))
        return toast("この人はもう打っているので外せません");
      if ((s.tips||[]).some(t=>t.toId===d.togglePart || t.fromIds.includes(d.togglePart)))
        return toast("この人は祝儀に出てくるので外せません");
      s.participantIds = s.participantIds.filter(p=>p!==d.togglePart);
    } else {
      const c = community(s.communityId);
      s.participantIds = c.members.filter(m=>
        s.participantIds.includes(m.id) || m.id===d.togglePart).map(m=>m.id);
    }
    save(); return render();
  }
  if (d.delSession !== undefined){
    const s = DB.sessions.find(x=>x.id===V.id);
    return askConfirm("この日の記録を削除", `${fmtDate(s.date)}の${s.games.length}半荘を削除します。`,
      "削除する", ()=>{
        const cid = s.communityId;
        deleteWithUndo(`${fmtDate(s.date)}の記録を削除しました`,
          {name:"community", id:cid, tab:"log"},
          ()=>{ DB.sessions = DB.sessions.filter(x=>x.id!==s.id); });
      });
  }

  if (d.carrySign){
    const c = community(V.id);
    const k = c.id + ":" + d.carrySign;
    const next = -carrySignOf(c, d.carrySign);
    carrySign[k] = next;
    const v = (c.carry||{})[d.carrySign];
    if (v){ c.carry[d.carrySign] = Math.abs(v) * next; save(); }
    render();
    const back = document.querySelector(`[data-carry="${d.carrySign}"]`);
    if (back) back.focus();
    return;
  }

  if (d.penSign){
    const s = DB.sessions.find(x=>x.id===V.id);
    const k = s.id + ":" + d.penSign;
    const next = -penSignOf(s, d.penSign);
    penSign[k] = next;
    const v = (s.penalties||{})[d.penSign];
    if (v){ s.penalties[d.penSign] = Math.abs(v) * next; save(); }
    render();
    const back = document.querySelector(`[data-penalty="${d.penSign}"]`);
    if (back) back.focus();
    return;
  }

  if (d.fillRest !== undefined){
    readDraft();
    const s = DB.sessions.find(x=>x.id===V.id);
    const R = rulesOf(s);
    const pts = sheet.draft.points;
    const i = pts.findIndex(p=>p === null);
    if (i < 0) return;
    const rest = R.startPoints*R.playerCount - pts.reduce((a,p)=>a+(p||0),0);
    sheet.draft.points[i] = rest;
    sheet.draft.signs[i] = rest < 0 ? -1 : 1;
    return renderSheet();
  }

  if (d.ptSign !== undefined){
    readDraft();
    const i = +d.ptSign;
    sheet.draft.signs[i] = -sheet.draft.signs[i];
    if (sheet.draft.points[i] != null)
      sheet.draft.points[i] = Math.abs(sheet.draft.points[i]) * sheet.draft.signs[i];
    renderSheet();
    const back = document.querySelector(`[data-pt="${i}"]`);
    if (back) back.focus();
    return;
  }

  if (d.toggleGame !== undefined){
    const gi = +d.toggleGame;
    const open = V.openGames || [];
    V.openGames = open.includes(gi) ? open.filter(x=>x!==gi) : open.concat(gi);
    return render();
  }

  if (d.addGame !== undefined) return openGameSheet(null);
  if (d.editGame !== undefined) return openGameSheet(+d.editGame);
  if (d.closeSheet !== undefined){ sheet = null; return render(); }
  if (d.saveGame !== undefined){
    readDraft();
    const s = DB.sessions.find(x=>x.id===V.id);
    const R = rulesOf(s);
    const n = R.playerCount;
    const {seats, points} = sheet.draft;
    if (new Set(seats).size !== n) return toast("同じ人が2席に入っています");
    if (points.some(p=>p===null || isNaN(p))) return toast("持ち点が入っていない席があります");
    if (points.reduce((a,b)=>a+b,0) !== R.startPoints*n)
      return toast("持ち点の合計が合っていません");
    const g = {seats:seats.slice(), points:points.slice()};
    const isNew = sheet.index == null;
    if (isNew) s.games.push(g); else s.games[sheet.index] = g;
    save(); sheet = null; render();
    return toast(isNew ? "記録しました" : "修正しました");
  }
  if (d.delGame !== undefined){
    const s = DB.sessions.find(x=>x.id===V.id);
    const gi = sheet.index;
    sheet = null;
    return deleteWithUndo(`半荘${gi+1}を削除しました`,
      Object.assign({}, V, {openGames:[]}),   // 番号がずれるので展開は閉じる
      ()=>{ s.games.splice(gi,1); });
  }

  if (d.export !== undefined){ sheet = {kind:"data", mode:"export"}; return render(); }
  if (d.import !== undefined){ sheet = {kind:"data", mode:"import"}; return render(); }

  if (d.askOk !== undefined){
    const fn = sheet && sheet.onOk;
    if (!fn) return;
    const inp = document.querySelector("[data-ask]");
    const val = inp ? inp.value : "";
    const before = sheet;
    if (fn(val) === false) return;                   // 入力に不備 → シートは開いたまま
    if (sheet === before){ sheet = null; render(); } // onOk が画面を動かさなかった場合だけ閉じる
    return;
  }

  if (d.copy !== undefined){
    const ta = document.querySelector("textarea[data-ask]");
    ta.select(); ta.setSelectionRange(0, ta.value.length);
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value)
        .then(()=>toast("コピーしました"))
        .catch(()=>toast("長押しで選択してコピーしてください"));
    } else {
      let ok = false;
      try { ok = document.execCommand("copy"); } catch(err){}
      toast(ok ? "コピーしました" : "長押しで選択してコピーしてください");
    }
    return;
  }

  if (d.download !== undefined){
    try {
      const blob = new Blob([JSON.stringify(DB,null,2)], {type:"application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `麻雀成績_${today()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
    } catch(err){ toast("保存できません。上の文字列をコピーしてください"); }
    return;
  }

  if (d.doImport !== undefined){
    const ta = document.querySelector("textarea[data-ask]");
    let data;
    try { data = JSON.parse(ta.value); }
    catch(err){ return toast("読み取れませんでした。全部貼れているか確認してください"); }
    if (!data || !Array.isArray(data.communities) || !Array.isArray(data.sessions))
      return toast("麻雀成績のデータではないようです");
    return askConfirm("データを置き換える",
      `今の記録を消して、コミュニティ${data.communities.length}件・${data.sessions.length}日分に置き換えます。`,
      "置き換える", ()=>{
        DB = Object.assign(newDB(), data); save(); go({name:"home"});
        toast("読み込みました");
      });
  }
});

// テキスト入力シートは Enter で決定できるようにする
document.addEventListener("keydown", e=>{
  if (e.key !== "Enter" || !sheet) return;
  if (e.target.matches("input[data-ask]")){
    e.preventDefault();
    const btn = document.querySelector("[data-ask-ok]");
    if (btn) btn.click();
  }
});

document.addEventListener("input", e=>{
  const d = e.target.dataset;
  if (d.pt !== undefined || d.seat !== undefined){ readDraft(); return updateTally(); }
});

document.addEventListener("change", e=>{
  const d = e.target.dataset;
  const val = e.target.value;

  if (d.seat !== undefined){ readDraft(); return renderSheet(); }  // 抜け番の表示も更新する

  if (d.memberName){
    const c = community(V.id);
    const m = c.members.find(x=>x.id===d.memberName);
    if (m && val.trim()){ m.name = val.trim(); save(); }
    return;
  }
  if (d.communityName !== undefined){
    const c = community(V.id);
    if (val.trim()){ c.name = val.trim(); save(); render(); }
    return;
  }
  if (d.rule === "tieBreak"){
    const c = community(V.id);
    c.rules.tieBreak = val === "split" ? "split" : "seat";
    save(); return render();
  }
  if (d.rule){
    const c = community(V.id);
    // 空欄のままだと Number("") が 0 になってしまうので、先に弾いて元の値に戻す
    if (val.trim() === "") return render();
    const num = Math.round(Number(val));
    if (isNaN(num)) return render();
    const least = {startPoints:1000, returnPoints:1000, rate:0, chipPoints:0, chipStart:0};
    if (d.rule in least && num < least[d.rule]) return render();
    if (d.rule === "playerCount"){
      if (num !== 3 && num !== 4) return render();
      if (DB.sessions.some(s=>s.communityId===c.id && s.games.length)){
        toast("記録があるので人数は変えられません"); return render();
      }
      c.rules = Object.assign(defaultRules(num),
        {rate:c.rules.rate, chipPoints:chipPoints(c.rules), chipStart:chipStart(c.rules)});
    } else {
      c.rules[d.rule] = num;
    }
    save(); return render();
  }
  if (d.uma !== undefined){
    const c = community(V.id);
    if (val.trim() === "") return render();
    const num = Math.round(Number(val));
    if (!isNaN(num)) c.rules.uma[+d.uma] = num;
    save(); return render();
  }
  if (d.chip){
    const s = DB.sessions.find(x=>x.id===V.id);
    s.chipCounts = s.chipCounts || {};
    if (val.trim() === "") delete s.chipCounts[d.chip];
    else {
      const num = Math.round(Number(val));
      if (isNaN(num)) return render();
      s.chipCounts[d.chip] = num;
    }
    if (s.chips) delete s.chips[d.chip]; // 古い増減の記録が残っていれば捨てる
    save(); return render();
  }
  if (d.carry){
    const c = community(V.id);
    c.carry = c.carry || {};
    const raw = val.trim();
    if (raw === ""){ delete c.carry[d.carry]; save(); return render(); }
    const num = Number(raw);
    if (isNaN(num)) return render();
    let sign = carrySignOf(c, d.carry);
    if (raw.startsWith("-") || num < 0){ sign = -1; carrySign[c.id+":"+d.carry] = -1; }
    c.carry[d.carry] = Math.abs(Math.round(num)) * sign;
    save(); return render();
  }

  if (d.penalty){
    const s = DB.sessions.find(x=>x.id===V.id);
    s.penalties = s.penalties || {};
    const raw = val.trim();
    if (raw === ""){ delete s.penalties[d.penalty]; save(); return render(); }
    const num = Number(raw);
    if (isNaN(num)) return render();
    // 「-10」と直接打たれたら、符号ボタンの側もそれに合わせる
    let sign = penSignOf(s, d.penalty);
    if (raw.startsWith("-") || num < 0){ sign = -1; penSign[s.id+":"+d.penalty] = -1; }
    s.penalties[d.penalty] = Math.abs(Math.round(num)) * sign;
    save(); return render();
  }
  if (d.sessionDate !== undefined){
    const s = DB.sessions.find(x=>x.id===V.id);
    if (val){ s.date = val; save(); render(); }
    return;
  }
});

/* 窓の幅を変えて広い⇔狭いをまたいだときだけ描き直す（グラフの形を切り替えるため）。
   入力中やシートを開いている間は触らない。iPhoneのキーボードでは幅が変わらないので発火しない。 */
window.addEventListener("resize", ()=>{
  const now = window.matchMedia("(min-width:760px)").matches;
  if (now === WIDE) return;
  if (sheet) return;
  const a = document.activeElement;
  if (a && (a.tagName === "INPUT" || a.tagName === "SELECT" || a.tagName === "TEXTAREA")) return;
  render();
});

render();
loadSetup();
loadShared();
refreshShared(true);
</script>
</body>
</html>
